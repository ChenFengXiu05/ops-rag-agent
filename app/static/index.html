<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>运维智能助手 — RAG Agent</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f1117;
      --surface: #1a1d27;
      --surface2: #242838;
      --border: #2e3348;
      --accent: #6366f1;
      --accent-hover: #4f52d3;
      --text: #e2e4f0;
      --text-dim: #8b8fa8;
      --user-bg: #1e3a5f;
      --bot-bg: #1a2535;
      --success: #22c55e;
      --danger: #ef4444;
      --warn: #f59e0b;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ── */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }
    header .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 600;
    }
    header .logo span.icon {
      font-size: 20px;
    }
    header .badge {
      font-size: 11px;
      background: var(--accent);
      color: white;
      padding: 2px 8px;
      border-radius: 999px;
      font-weight: 500;
    }
    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }
    .status-dot.online { background: var(--success); }
    .status-text { font-size: 12px; color: var(--text-dim); }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow-y: auto;
    }
    .sidebar-section {
      padding: 14px 16px 8px;
    }
    .sidebar-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }

    /* Upload area */
    .upload-area {
      border: 1.5px dashed var(--border);
      border-radius: 8px;
      padding: 14px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
    }
    .upload-area:hover {
      border-color: var(--accent);
      background: rgba(99,102,241,0.05);
    }
    .upload-area input { display: none; }
    .upload-area .upload-icon { font-size: 22px; margin-bottom: 6px; }
    .upload-area p { font-size: 12px; color: var(--text-dim); line-height: 1.5; }
    .upload-area p strong { color: var(--text); }

    /* File list */
    .file-list {
      padding: 0 16px;
    }
    .file-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 12px;
      color: var(--text-dim);
      transition: background 0.15s;
    }
    .file-item:hover { background: var(--surface2); }
    .file-item .file-icon { font-size: 14px; flex-shrink: 0; }
    .file-item .file-name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .file-item .file-status {
      font-size: 10px;
      padding: 1px 6px;
      border-radius: 999px;
    }
    .file-item .file-status.ok { background: rgba(34,197,94,0.15); color: var(--success); }
    .file-item .file-status.uploading { background: rgba(245,158,11,0.15); color: var(--warn); }
    .file-item .file-status.error { background: rgba(239,68,68,0.15); color: var(--danger); }

    /* Settings */
    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 13px;
    }
    .setting-row label { color: var(--text-dim); }
    .setting-row input[type="number"] {
      width: 56px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 5px;
      padding: 3px 7px;
      font-size: 13px;
      text-align: right;
    }
    .setting-row input[type="checkbox"] {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    /* Quick questions */
    .quick-btns {
      display: flex;
      flex-direction: column;
      gap: 5px;
      padding: 0 16px 14px;
    }
    .quick-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
      padding: 7px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      line-height: 1.4;
    }
    .quick-btn:hover {
      border-color: var(--accent);
      color: var(--text);
      background: rgba(99,102,241,0.08);
    }

    /* ── Chat area ── */
    .chat-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    .messages::-webkit-scrollbar { width: 5px; }
    .messages::-webkit-scrollbar-track { background: transparent; }
    .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

    /* Welcome screen */
    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 40px 20px;
      gap: 12px;
    }
    .welcome .logo-big { font-size: 48px; }
    .welcome h2 { font-size: 20px; font-weight: 600; }
    .welcome p { font-size: 14px; color: var(--text-dim); max-width: 420px; line-height: 1.6; }
    .welcome .tags { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 4px; }
    .welcome .tag {
      font-size: 11px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-dim);
      padding: 3px 10px;
      border-radius: 999px;
    }

    /* Message bubble */
    .message {
      display: flex;
      gap: 10px;
      max-width: 100%;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

    .message.user { flex-direction: row-reverse; }
    .message.user .bubble { background: var(--user-bg); border-radius: 16px 4px 16px 16px; }
    .message.bot .bubble { background: var(--bot-bg); border-radius: 4px 16px 16px 16px; }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.user .avatar { background: var(--accent); }
    .message.bot .avatar { background: var(--surface2); border: 1px solid var(--border); }

    .bubble {
      max-width: 72%;
      padding: 12px 14px;
      border: 1px solid var(--border);
      line-height: 1.65;
      font-size: 14px;
    }
    .message.user .bubble { max-width: 65%; }

    .bubble pre {
      background: rgba(0,0,0,0.3);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      overflow-x: auto;
      font-size: 12px;
      margin: 8px 0;
      font-family: "JetBrains Mono", "Fira Code", monospace;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .bubble code {
      font-family: "JetBrains Mono", "Fira Code", monospace;
      font-size: 12px;
      background: rgba(0,0,0,0.25);
      padding: 1px 5px;
      border-radius: 3px;
    }
    .bubble pre code { background: transparent; padding: 0; }

    /* Typing indicator */
    .typing-indicator {
      display: flex;
      gap: 4px;
      align-items: center;
      padding: 4px 0;
    }
    .typing-indicator span {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.2s infinite;
    }
    .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
    .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Sources panel */
    .sources {
      margin-top: 10px;
      border-top: 1px solid var(--border);
      padding-top: 8px;
    }
    .sources-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 6px;
    }
    .source-item {
      font-size: 12px;
      color: var(--text-dim);
      background: rgba(0,0,0,0.2);
      border-radius: 5px;
      padding: 6px 9px;
      margin-bottom: 5px;
      border-left: 2px solid var(--accent);
    }
    .source-item .source-file {
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .source-item .source-excerpt {
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .meta-row {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 11px;
      color: var(--text-dim);
    }
    .meta-row span { display: flex; align-items: center; gap: 3px; }

    /* ── Input area ── */
    .input-area {
      padding: 14px 20px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-row textarea {
      flex: 1;
      background: var(--surface2);
      border: 1.5px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 14px;
      font-family: inherit;
      resize: none;
      min-height: 44px;
      max-height: 160px;
      line-height: 1.5;
      transition: border-color 0.2s;
      overflow-y: hidden;
    }
    .input-row textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    .input-row textarea::placeholder { color: var(--text-dim); }

    .send-btn {
      background: var(--accent);
      border: none;
      color: white;
      width: 44px;
      height: 44px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: background 0.15s, transform 0.1s;
    }
    .send-btn:hover { background: var(--accent-hover); }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: var(--border); cursor: not-allowed; }

    .input-hint {
      font-size: 11px;
      color: var(--text-dim);
      margin-top: 6px;
      padding-left: 2px;
    }

    /* Clear chat btn */
    .clear-btn {
      background: none;
      border: 1px solid var(--border);
      color: var(--text-dim);
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { border-color: var(--danger); color: var(--danger); }

    /* Upload progress */
    .upload-progress {
      margin-top: 8px;
      font-size: 12px;
      color: var(--text-dim);
      padding: 6px 10px;
      background: var(--surface2);
      border-radius: 6px;
      display: none;
    }
    .upload-progress.show { display: block; }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <span class="icon">🤖</span>
    运维智能助手
    <span class="badge">RAG Agent</span>
  </div>
  <div class="header-actions">
    <div class="status-dot" id="statusDot"></div>
    <span class="status-text" id="statusText">检查连接中…</span>
    <button class="clear-btn" onclick="clearChat()">清空对话</button>
  </div>
</header>

<div class="layout">

  <!-- Sidebar -->
  <aside class="sidebar">
    <!-- Upload -->
    <div class="sidebar-section">
      <div class="sidebar-title">📁 知识库文档</div>
      <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".txt,.md,.pdf" multiple onchange="handleUpload(this.files)" />
        <div class="upload-icon">📤</div>
        <p><strong>点击上传文档</strong><br/>支持 .txt · .md · .pdf</p>
      </div>
      <div class="upload-progress" id="uploadProgress"></div>
    </div>

    <div class="file-list" id="fileList"></div>

    <!-- Settings -->
    <div class="sidebar-section" style="margin-top:4px;">
      <div class="sidebar-title">⚙️ 检索参数</div>
      <div class="setting-row">
        <label>召回 Top-K</label>
        <input type="number" id="topK" value="5" min="1" max="20" />
      </div>
      <div class="setting-row">
        <label>使用重排序</label>
        <input type="checkbox" id="useReranker" />
      </div>
    </div>

    <!-- Quick questions -->
    <div class="sidebar-section">
      <div class="sidebar-title">💡 快捷问题</div>
    </div>
    <div class="quick-btns">
      <button class="quick-btn" onclick="sendQuick('Kubernetes Pod 处于 CrashLoopBackOff 状态如何排查？')">K8s Pod CrashLoopBackOff 排查</button>
      <button class="quick-btn" onclick="sendQuick('Linux 服务器 CPU 使用率过高如何处理？')">Linux CPU 使用率高处理</button>
      <button class="quick-btn" onclick="sendQuick('MySQL 数据库如何做全量备份？')">MySQL 全量备份步骤</button>
      <button class="quick-btn" onclick="sendQuick('Nginx 502 Bad Gateway 怎么排查？')">Nginx 502 故障排查</button>
      <button class="quick-btn" onclick="sendQuick('Prometheus 告警 NodeMemoryUsageHigh 如何处理？')">内存告警处理流程</button>
      <button class="quick-btn" onclick="sendQuick('如何查看 Kubernetes Pod 的日志？')">如何查看 Pod 日志</button>
    </div>
  </aside>

  <!-- Chat -->
  <div class="chat-container">
    <div class="messages" id="messages">
      <div class="welcome" id="welcome">
        <div class="logo-big">🛠️</div>
        <h2>运维智能助手</h2>
        <p>基于 RAG 技术的运维知识问答系统，支持 K8s、Linux、MySQL、Nginx 等场景的智能检索与解答。</p>
        <div class="tags">
          <span class="tag">Kubernetes</span>
          <span class="tag">Linux 巡检</span>
          <span class="tag">MySQL 备份</span>
          <span class="tag">Nginx 故障</span>
          <span class="tag">监控告警</span>
          <span class="tag">SOP 文档检索</span>
        </div>
      </div>
    </div>

    <div class="input-area">
      <div class="input-row">
        <textarea
          id="questionInput"
          placeholder="输入运维问题，按 Enter 发送，Shift+Enter 换行…"
          rows="1"
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"
        ></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" title="发送">
          ➤
        </button>
      </div>
      <div class="input-hint">Powered by minimax-m2.5 · ChromaDB · BGE-large-zh</div>
    </div>
  </div>

</div>

<script>
const API_BASE = window.location.origin;
let chatHistory = [];
let uploadedFiles = [];
let isWaiting = false;

// ── Health check ────────────────────────────────────────────────────────────
async function checkHealth() {
  try {
    const res = await fetch(`${API_BASE}/health`);
    const data = await res.json();
    document.getElementById('statusDot').className = 'status-dot online';
    document.getElementById('statusText').textContent = `${data.llm_provider} · ${data.vector_store}`;
  } catch {
    document.getElementById('statusDot').className = 'status-dot';
    document.getElementById('statusText').textContent = '连接失败';
  }
}
checkHealth();
setInterval(checkHealth, 30000);

// ── Auto resize textarea ─────────────────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 160) + 'px';
}

// ── Key handler ──────────────────────────────────────────────────────────────
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
}

// ── Send quick question ──────────────────────────────────────────────────────
function sendQuick(text) {
  document.getElementById('questionInput').value = text;
  sendMessage();
}

// ── Clear chat ───────────────────────────────────────────────────────────────
function clearChat() {
  chatHistory = [];
  const msgs = document.getElementById('messages');
  msgs.innerHTML = `
    <div class="welcome" id="welcome">
      <div class="logo-big">🛠️</div>
      <h2>运维智能助手</h2>
      <p>基于 RAG 技术的运维知识问答系统，支持 K8s、Linux、MySQL、Nginx 等场景的智能检索与解答。</p>
      <div class="tags">
        <span class="tag">Kubernetes</span>
        <span class="tag">Linux 巡检</span>
        <span class="tag">MySQL 备份</span>
        <span class="tag">Nginx 故障</span>
        <span class="tag">监控告警</span>
        <span class="tag">SOP 文档检索</span>
      </div>
    </div>`;
}

// ── Send message ─────────────────────────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question || isWaiting) return;

  // Remove welcome screen
  const welcome = document.getElementById('welcome');
  if (welcome) welcome.remove();

  isWaiting = true;
  document.getElementById('sendBtn').disabled = true;
  input.value = '';
  input.style.height = 'auto';

  appendMessage('user', question, null, null);

  // Typing indicator
  const typingId = 'typing_' + Date.now();
  appendTyping(typingId);

  try {
    const topK = parseInt(document.getElementById('topK').value) || 5;
    const useReranker = document.getElementById('useReranker').checked;

    const payload = {
      question,
      collection_name: 'ops_knowledge',
      top_k: topK,
      use_reranker: useReranker,
      chat_history: chatHistory.slice(-10),
    };

    const res = await fetch(`${API_BASE}/api/v1/ask`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload),
    });

    removeTyping(typingId);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ detail: res.statusText }));
      appendMessage('bot', `❌ 请求失败：${err.detail || res.statusText}`, null, null);
    } else {
      const data = await res.json();
      appendMessage('bot', data.answer, data.sources, {
        tokens: data.tokens_used,
        latency: data.latency_ms,
      });
      chatHistory.push({ role: 'user', content: question });
      chatHistory.push({ role: 'assistant', content: data.answer });
    }
  } catch (e) {
    removeTyping(typingId);
    appendMessage('bot', `❌ 网络错误：${e.message}`, null, null);
  }

  isWaiting = false;
  document.getElementById('sendBtn').disabled = false;
  input.focus();
}

// ── Append message ───────────────────────────────────────────────────────────
function appendMessage(role, text, sources, meta) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;

  const avatar = role === 'user' ? '👤' : '🤖';
  const escapedText = escapeHtml(text);
  const formatted = formatText(escapedText);

  let sourcesHtml = '';
  if (sources && sources.length > 0) {
    const items = sources.slice(0, 4).map(s => {
      const file = s.metadata?.file_name || s.metadata?.source || '文档';
      const fname = file.split('/').pop().split('\\').pop();
      const excerpt = escapeHtml((s.content || '').substring(0, 120));
      return `<div class="source-item">
        <div class="source-file">📄 ${escapeHtml(fname)}</div>
        <div class="source-excerpt">${excerpt}…</div>
      </div>`;
    }).join('');
    sourcesHtml = `<div class="sources">
      <div class="sources-title">参考来源 (${sources.length})</div>
      ${items}
    </div>`;
  }

  let metaHtml = '';
  if (meta) {
    metaHtml = `<div class="meta-row">
      ${meta.tokens ? `<span>🔤 ${meta.tokens} tokens</span>` : ''}
      ${meta.latency ? `<span>⏱ ${meta.latency.toFixed(0)}ms</span>` : ''}
    </div>`;
  }

  div.innerHTML = `
    <div class="avatar">${avatar}</div>
    <div class="bubble">
      ${formatted}
      ${sourcesHtml}
      ${metaHtml}
    </div>`;

  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function appendTyping(id) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = id;
  div.innerHTML = `
    <div class="avatar">🤖</div>
    <div class="bubble">
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    </div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

// ── Text formatting ──────────────────────────────────────────────────────────
function escapeHtml(str) {
  return str
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function formatText(text) {
  // Code blocks (```...```)
  text = text.replace(/```([\s\S]*?)```/g, (_, code) => `<pre><code>${code.trim()}</code></pre>`);
  // Inline code
  text = text.replace(/`([^`]+)`/g, '<code>$1</code>');
  // Bold
  text = text.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  // Line breaks
  text = text.replace(/\n/g, '<br/>');
  return text;
}

// ── File upload ──────────────────────────────────────────────────────────────
async function handleUpload(files) {
  const progress = document.getElementById('uploadProgress');
  const fileList = document.getElementById('fileList');

  for (const file of files) {
    const itemId = 'file_' + Date.now() + Math.random().toString(36).substr(2,5);

    // Add to sidebar list
    const item = document.createElement('div');
    item.className = 'file-item';
    item.id = itemId;
    item.innerHTML = `
      <span class="file-icon">📄</span>
      <span class="file-name" title="${escapeHtml(file.name)}">${escapeHtml(file.name)}</span>
      <span class="file-status uploading">上传中</span>`;
    fileList.appendChild(item);

    progress.className = 'upload-progress show';
    progress.textContent = `正在上传 ${file.name}…`;

    try {
      const formData = new FormData();
      formData.append('file', file);
      formData.append('collection_name', 'ops_knowledge');

      const res = await fetch(`${API_BASE}/api/v1/documents/upload`, {
        method: 'POST',
        body: formData,
      });

      if (res.ok) {
        const data = await res.json();
        item.querySelector('.file-status').className = 'file-status ok';
        item.querySelector('.file-status').textContent = `✓ ${data.chunks_added || '已入库'}`;
        progress.textContent = `✓ ${file.name} 上传成功`;
      } else {
        const err = await res.json().catch(() => ({}));
        item.querySelector('.file-status').className = 'file-status error';
        item.querySelector('.file-status').textContent = '失败';
        progress.textContent = `✗ ${file.name}: ${err.detail || '上传失败'}`;
      }
    } catch (e) {
      item.querySelector('.file-status').className = 'file-status error';
      item.querySelector('.file-status').textContent = '错误';
      progress.textContent = `✗ ${file.name}: ${e.message}`;
    }
  }

  setTimeout(() => { progress.className = 'upload-progress'; }, 3000);

  // Reset file input
  document.getElementById('fileInput').value = '';
}

// Drag and drop support
const uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('dragover', e => {
  e.preventDefault();
  uploadArea.style.borderColor = 'var(--accent)';
  uploadArea.style.background = 'rgba(99,102,241,0.08)';
});
uploadArea.addEventListener('dragleave', () => {
  uploadArea.style.borderColor = '';
  uploadArea.style.background = '';
});
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.style.borderColor = '';
  uploadArea.style.background = '';
  handleUpload(e.dataTransfer.files);
});
</script>
