services:
  # ── Core App ────────────────────────────────────────────────────────────────
  # ChromaDB 运行在嵌入模式（embedded），直接写入容器内 /app/data/chroma
  # BGE 模型缓存挂载到宿主机 ./models，避免每次重启重新下载
  app:
    build: .
    container_name: ops-rag-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - ES_HOST=http://elasticsearch:9200
      - PROMETHEUS_URL=http://prometheus:9090
      # BGE 模型缓存目录（映射到宿主机 ./models，避免重复下载）
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      # 国内镜像加速（如需要）
      # - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      # BGE 模型持久化（宿主机目录，容器重建不丢失）
      - ./models:/app/models
      # K8s 集群访问（挂载 kubeconfig，Agent 可以执行 kubectl 命令）
      - ${KUBECONFIG_PATH:-~/.kube/config}:/root/.kube/config:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ops-net

  # ── Elasticsearch ─────────────────────────────────────────────────────────────
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: ops-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - ops-net

  # ── Prometheus ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: ops-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    networks:
      - ops-net

  # ── Grafana ────────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.5
    container_name: ops-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - ops-net

volumes:
  app_data:
  app_logs:
  es_data:
  prometheus_data:
  grafana_data:

networks:
  ops-net:
    driver: bridge
