# 最小化部署：仅启动核心 RAG Agent，不含 ES / Prometheus / Grafana
# 适合首次部署验证、资源有限的节点
# 使用方式：docker compose -f docker-compose.minimal.yml up -d

services:
  app:
    build: .
    container_name: ops-rag-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      # BGE / HuggingFace 国内镜像（hf-mirror.com 无需翻墙）
      - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      # BGE 模型持久化缓存（宿主机目录，容器重建不用重新下载）
      - ./models:/app/models
      # K8s 访问：直接挂载宿主机 kubectl 二进制（工作节点已有，无需容器内安装）
      - /usr/bin/kubectl:/usr/local/bin/kubectl:ro
      # K8s 集群认证配置
      - /root/.kube:/root/.kube:ro
    restart: unless-stopped

volumes:
  app_data:
  app_logs:
