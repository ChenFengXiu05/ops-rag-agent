# 最小化部署：仅启动核心 RAG Agent，不含 ES / Prometheus / Grafana
# 适合首次部署验证、资源有限的节点
# 使用方式：docker compose -f docker-compose.minimal.yml up -d

services:
  app:
    build: .
    container_name: ops-rag-agent
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - VECTOR_STORE=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      # 国内 HuggingFace 镜像（内网无法访问 HF 时启用）
      # - HF_ENDPOINT=https://hf-mirror.com
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
      - ./models:/app/models
      - ${KUBECONFIG_PATH:-~/.kube/config}:/root/.kube/config:ro
    restart: unless-stopped

volumes:
  app_data:
  app_logs:
