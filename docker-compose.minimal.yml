# 最小化部署：仅启动核心 RAG Agent，不含 ES / Prometheus / Grafana
# 外部 Prometheus / Grafana 通过 .env 配置地址接入
# 使用方式：docker compose -f docker-compose.minimal.yml up -d

services:
  app:
    build: .
    container_name: ops-rag-agent
    # network_mode: host 让容器直接使用宿主机网络
    # 好处：容器可直接访问宿主机上的 Prometheus(9090) / Grafana(3000) / ES(9200)
    # 缺点：ports 映射无效，服务直接监听宿主机 8000 端口
    network_mode: host
    env_file:
      - .env
    environment:
      - VECTOR_STORE=chroma
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - HF_HOME=/app/models
      - TRANSFORMERS_CACHE=/app/models
      - HF_ENDPOINT=https://hf-mirror.com
      - LANGCHAIN_TRACING_V2=false
      - LANGCHAIN_API_KEY=
    volumes:
      # 挂载宿主机代码目录 → git pull 后 restart 即生效，无需重新 build
      - .:/app
      # 数据和日志用命名卷持久化（覆盖上面挂载里的同名目录）
      - app_data:/app/data
      - app_logs:/app/logs
      # BGE 模型缓存
      - ./models:/app/models
      - /usr/bin/kubectl:/usr/local/bin/kubectl:ro
      - /root/.kube:/root/.kube:ro
    restart: unless-stopped

volumes:
  app_data:
  app_logs:
